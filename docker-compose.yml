version: '3.8'

services:
  k3scluster:
    image: rancher/k3s:latest
    container_name: k3s-server
    privileged: true
    command:
      - server
      - --disable=traefik
      - --write-kubeconfig-mode=644
      - --tls-san=127.0.0.1
      - --tls-san=localhost
      - --tls-san=k3s.localhost
      - --bind-address=0.0.0.0
    ports:
      - "6443:6443"  # Kubernetes API server
    environment:
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=644
    volumes:
      - k3s-storage:/var/lib/rancher/k3s
      - ./kubeconfig:/output
      - ./registries.yaml:/etc/rancher/k3s/registries.yaml
    networks:
      - k3s-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kubectl", "get", "nodes"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - registry

  registry:
    image: registry:2.8
    container_name: local-registry
    ports:
      - "5000:5000"
    volumes:
      - registry-storage:/var/lib/registry
    networks:
      - k3s-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  k3s-storage:
  registry-storage:

networks:
  k3s-network:
    driver: bridge