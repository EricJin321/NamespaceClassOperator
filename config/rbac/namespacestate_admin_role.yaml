# This rule is not used by the project namespaceclassoperator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over policy.akuity.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: namespaceclassoperator
    app.kubernetes.io/managed-by: kustomize
  name: namespacestate-admin-role
rules:
- apiGroups:
  - policy.akuity.io
  resources:
  - namespacestates
  verbs:
  - '*'
- apiGroups:
  - policy.akuity.io
  resources:
  - namespacestates/status
  verbs:
  - get
