---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-policy-akuity-io-v1alpha-namespaceclass
  failurePolicy: Fail
  name: vnamespaceclass-v1alpha.kb.io
  rules:
  - apiGroups:
    - policy.akuity.io
    apiVersions:
    - v1alpha
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - namespaceclasses
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-policy-akuity-io-v1alpha-namespaceclassitem
  failurePolicy: Fail
  name: vnamespaceclassitem-v1alpha.kb.io
  rules:
  - apiGroups:
    - policy.akuity.io
    apiVersions:
    - v1alpha
    operations:
    - CREATE
    - UPDATE
    resources:
    - namespaceclassitems
  sideEffects: None
